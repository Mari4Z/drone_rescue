<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Rescue 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e6edf3; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: absolute; background: rgba(10, 18, 32, .62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border: 1px solid rgba(148, 163, 184, .25); border-radius: 12px; padding: 12px 14px; line-height: 1.55; }
  #hud { top: 14px; left: 14px; max-width: min(460px, calc(100vw - 60px)); }
  #hud b { color: #7dd3fc; }
  #gauges { top: 14px; right: 14px; text-align: right; min-width: 150px; }
  #gauges .big { font-size: 28px; font-weight: 700; color: #fde68a; font-variant-numeric: tabular-nums; }
  #phase { font-weight: 600; color: #a5f3fc; }
  #bar { bottom: 14px; left: 50%; transform: translateX(-50%); width: min(720px, calc(100vw - 60px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #timeline { flex: 1; min-width: 160px; accent-color: #38bdf8; }
  button { background: rgba(30, 41, 59, .9); color: #e6edf3; border: 1px solid #334155; border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #334155; }
  button.on { background: #0369a1; border-color: #38bdf8; }
  .muted { opacity: .7; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #0f172a; border: 1px solid #334155; font-size: 12px; }
  .a { color: #4ade80; } .b { color: #f87171; }
  #battery { display: none; margin-top: 8px; }
  #battery .track { height: 10px; border-radius: 6px; background: #1e293b; border: 1px solid #334155; overflow: hidden; }
  #battery .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4ade80, #a3e635); transition: width .15s linear, background .3s; }
  #battery .fill.low { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  #battery .fill.critical { background: linear-gradient(90deg, #ef4444, #f87171); }
  #wind { display: none; margin-top: 6px; }
  #gust { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 999px;
          background: rgba(239, 68, 68, .85); color: #fff; font-weight: 700; font-size: 18px; z-index: 5; pointer-events: none; }
  #error { display: none; position: absolute; inset: 0; margin: auto; width: min(560px, 90vw); height: fit-content; background: #3f1d1d; border: 1px solid #f87171; border-radius: 8px; padding: 16px 20px; line-height: 1.5; z-index: 9; }
  #error code { background: #0f1720; padding: 2px 6px; border-radius: 4px; }
</style>
<script>
  // Si algo falla (sin datos, sin internet para cargar three.js, sin WebGL) se muestra en vez de una pantalla negra
  function showError(html) {
    const el = document.getElementById("error");
    el.innerHTML = html;
    el.style.display = "block";
  }
  addEventListener("error", (e) => {
    if (document.getElementById("error").style.display === "block") return;
    const src = e.target && e.target.src;
    showError(src
      ? `No se pudo cargar <code>${src}</code>. ¿Hay conexión a internet?`
      : `Error: ${e.message}`);
  }, true);
  setTimeout(() => {
    if (!window.__droneReady && document.getElementById("error").style.display !== "block")
      showError("three.js no terminó de cargar. Revisa la conexión a internet o abre el archivo en Chrome, Firefox o Safari reciente.");
  }, 8000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud" class="panel">
  <div><b id="title"></b></div>
  <div id="mapinfo" class="muted"></div>
  <div style="margin-top:4px"><span class="a">● A</span> despegue &nbsp; <span class="b">● B</span> entrega
    &nbsp; <span class="muted">edificios: <span style="color:#cbd5e1">bajos</span> → <span style="color:#94a3b8">altos</span></span>
    <span id="citylegend" class="muted" style="display:none">&nbsp; <span style="color:#fbbf24">┃</span> postes y cables &nbsp; <span style="color:#f472b6">▲</span> aves</span></div>
  <div style="margin-top:6px"><span class="badge" id="engine"></span></div>
</div>
<div id="gauges" class="panel">
  <div class="muted">altura</div>
  <div class="big" id="alt">0 m</div>
  <div id="phase"></div>
  <div class="muted" id="stepinfo"></div>
  <div id="battery"><div class="muted">batería <span id="batt-pct"></span></div><div class="track"><div class="fill" id="batt-fill"></div></div></div>
  <div id="wind" class="muted"></div>
</div>
<div id="gust">💨 ráfaga</div>
<div id="bar" class="panel">
  <button id="prev" title="mapa anterior (←)">◀ mapa</button>
  <button id="next" title="mapa siguiente (→)">mapa ▶</button>
  <button id="play" title="pausa (espacio)">⏸ pausa</button>
  <input id="timeline" type="range" min="0" max="1" step="0.01" value="0">
  <button id="cam" title="cambiar cámara (C)">🎥 Libre</button>
  <button id="xray" title="edificios transparentes (X)">Rayos X</button>
  <label class="muted">vel <input id="speed" type="range" min="1" max="20" value="5" style="width:70px"></label>
</div>
<div id="error"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Sky } from "three/addons/objects/Sky.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const DATA = /*DATA*/null;
window.__droneReady = true;
if (!DATA) {
  showError(`Esta es la <b>plantilla</b>, no tiene datos. Genera la vista con:<br><br>
    <code>.venv/bin/python cli.py run --model models/dqn.pt --web</code><br><br>
    y abre <code>drone_view.html</code> (en la raíz del proyecto).`);
  throw new Error("sin datos");
}
if (!document.createElement("canvas").getContext("webgl2")) {
  showError("Este navegador no tiene WebGL activado; three.js lo necesita.");
  throw new Error("sin WebGL");
}
const { cell, size, env } = DATA;
let { start, goal } = DATA;
// Formato antiguo (un solo intento) o nuevo (lista de mapas)
const episodes = DATA.episodes || [{ columns: DATA.columns, path: DATA.path, result: DATA.result }];
const [NX, NY, NZ] = size;
const W = NX * cell, D = NY * cell, H = NZ * cell;
const CENTER = new THREE.Vector3(W / 2, 0, -D / 2);
document.getElementById("engine").textContent = `three.js r${THREE.REVISION} · WebGL2`;

// Coordenadas: x del entorno -> x, y del entorno -> -z, altura -> y (y arriba en three.js)
const toWorld = ([x, y, z]) => new THREE.Vector3((x + .5) * cell, (z + .5) * cell, -(y + .5) * cell);
const isPad = (p) => (p[0] === start[0] && p[1] === start[1]) || (p[0] === goal[0] && p[1] === goal[1]);
const STORM = episodes.some((e) => e.battery);  // grid-drone-v2: viento, batería y B por mapa

// ---------- Render, cámara, postproceso ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb7cde3, 260, 900);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;  // reflejos suaves

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 6000);
camera.position.set(W + 55 * (W / 100), 95 * Math.sqrt(W / 100), 40 * (W / 100));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(W / 2, 12, -D / 2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;  // no atravesar el suelo
controls.minDistance = 10;
controls.maxDistance = 600 * Math.max(1, W / 100);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Cielo y luz ----------
const sky = new Sky();
sky.scale.setScalar(5000);
scene.add(sky);
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(58), THREE.MathUtils.degToRad(210));
sky.material.uniforms.turbidity.value = 6;
sky.material.uniforms.rayleigh.value = 1.6;
sky.material.uniforms.mieCoefficient.value = 0.004;
sky.material.uniforms.mieDirectionalG.value = 0.85;
sky.material.uniforms.sunPosition.value.copy(sunDir);

scene.add(new THREE.HemisphereLight(0xdbeafe, 0x3f4f2f, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.copy(CENTER).addScaledVector(sunDir, 160);
sun.target.position.copy(CENTER);
sun.castShadow = true;
const shadowReach = Math.max(W, D) * 0.9;
Object.assign(sun.shadow.camera, { left: -shadowReach, right: shadowReach, top: shadowReach, bottom: -shadowReach, near: 10, far: 400 + shadowReach });
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---------- Texturas procedurales (canvas) ----------
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#4d6b3a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    const v = 60 + rand() * 50 | 0;
    g.fillStyle = `rgba(${v - 20},${v + 30},${v - 30},.35)`;
    g.fillRect(rand() * w, rand() * h, 2, 2);
  }
}, [60, 60]);
const plazaTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#8d949c"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(0,0,0,${rand() * .08})`; g.fillRect(rand() * w, rand() * h, 2, 2); }
  g.strokeStyle = "rgba(40,44,52,.55)"; g.lineWidth = 3; g.strokeRect(0, 0, w, h);  // juntas = rejilla de 5 m
}, [NX, NY]);
// Fachada: una celda de 5 x 5 m con 2 x 2 ventanas; mapa de emisión con algunas encendidas
const facadeTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#d6d9de"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#c3c7cd"; g.fillRect(0, h - 10, w, 10);
  for (const [x, y] of [[14, 14], [72, 14], [14, 70], [72, 70]]) {
    const grad = g.createLinearGradient(x, y, x + 42, y + 44);
    grad.addColorStop(0, "#5b7a99"); grad.addColorStop(1, "#22364d");
    g.fillStyle = grad; g.fillRect(x, y, 42, 44);
    g.fillStyle = "rgba(255,255,255,.18)"; g.fillRect(x + 2, y + 2, 12, 40);
  }
});
const facadeGlow = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#ffcf7a"; g.fillRect(72, 70, 42, 44);
});
const roofTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#59606b"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 800; i++) { g.fillStyle = `rgba(255,255,255,${rand() * .06})`; g.fillRect(rand() * w, rand() * h, 3, 3); }
  g.strokeStyle = "#3b4048"; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
});

// ---------- Terreno ----------
const grass = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
grass.rotation.x = -Math.PI / 2;
grass.position.copy(CENTER).setY(-0.05);
grass.receiveShadow = true;
scene.add(grass);
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ map: plazaTex, roughness: .9 }));
plaza.rotation.x = -Math.PI / 2;
plaza.position.copy(CENTER).setY(0.02);
plaza.receiveShadow = true;
scene.add(plaza);
// Límite del espacio de vuelo (100 x 100 x 60 m)
const bounds = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)),
  new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: .18 }));
bounds.position.copy(CENTER).setY(H / 2);
scene.add(bounds);

// ---------- Helipuertos A y B ----------
const pads = [];
const padGroups = {};
function helipad(p, color, label) {
  const hex = "#" + color.toString(16).padStart(6, "0");
  const g = new THREE.Group();
  const top = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = "#1f2937"; c.fillRect(0, 0, w, h);
    c.strokeStyle = hex; c.lineWidth = 14; c.beginPath(); c.arc(128, 128, 108, 0, Math.PI * 2); c.stroke();
    c.fillStyle = "#f8fafc"; c.font = "bold 150px system-ui"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("H", 128, 136);
  });
  const side = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: .3, roughness: .6 });
  const disk = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.6, 0.8, 48),
    [side, new THREE.MeshStandardMaterial({ map: top, roughness: .7 }), side]);
  disk.position.y = 0.4;
  disk.castShadow = disk.receiveShadow = true;
  g.add(disk);
  const lights = [];
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * Math.PI * 2;
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), new THREE.MeshBasicMaterial({ color }));
    l.position.set(Math.cos(a) * 4.4, 0.95, Math.sin(a) * 4.4);
    g.add(l);
    lights.push(l);
  }
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 2.2, H, 24, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .08, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  beam.position.y = H / 2;
  g.add(beam);
  const lc = document.createElement("canvas");
  lc.width = 256; lc.height = 128;
  const ctx = lc.getContext("2d");
  ctx.fillStyle = "rgba(15,23,42,.8)"; ctx.beginPath(); ctx.roundRect(8, 8, 240, 112, 30); ctx.fill();
  ctx.strokeStyle = hex; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = hex; ctx.font = "bold 70px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, 128, 68);
  const labelTex = new THREE.CanvasTexture(lc); labelTex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex, depthTest: false }));
  s.scale.set(14, 7, 1);
  s.position.y = 12;
  s.renderOrder = 10;
  g.add(s);
  const w = toWorld(p);
  g.position.set(w.x, 0, w.z);
  scene.add(g);
  pads.push({ lights, color: new THREE.Color(color) });
  padGroups[label] = g;
}
helipad(start, 0x4ade80, "A");
helipad(goal, 0xf87171, "B");
function movePad(label, p) {
  const w = toWorld(p);
  padGroups[label].position.set(w.x, 0, w.z);
}

// ---------- Viento: manga y flechas que recorren el cielo (solo grid-drone-v2) ----------
const windGroup = new THREE.Group();
scene.add(windGroup);
const windArrows = [];
if (STORM) {
  const mat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: .55, depthWrite: false });
  for (let k = 0; k < 28; k++) {
    const a = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 5, 6), mat);
    shaft.rotation.z = Math.PI / 2;
    const head = new THREE.Mesh(new THREE.ConeGeometry(.5, 1.4, 8), mat);
    head.rotation.z = -Math.PI / 2; head.position.x = 3.1;
    a.add(shaft, head);
    a.userData.phase = Math.random();
    a.userData.lane = [Math.random(), Math.random()];
    windGroup.add(a);
    windArrows.push(a);
  }
  // Manga de viento junto a A
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.12, .15, 14, 8), new THREE.MeshStandardMaterial({ color: 0xcbd5e1 }));
  pole.position.set(toWorld(start).x - 7, 7, toWorld(start).z + 7);
  const sock = new THREE.Mesh(new THREE.ConeGeometry(.9, 5, 10, 1, true),
    new THREE.MeshStandardMaterial({ color: 0xf97316, side: THREE.DoubleSide, emissive: 0xf97316, emissiveIntensity: .25 }));
  sock.position.copy(pole.position).setY(13.5);
  windGroup.add(pole, sock);
  windGroup.userData.sock = sock;
}
function setWind(E) {
  if (!STORM) return;
  const [wx, wy] = E.wind_dir || [1, 0];
  // y del entorno -> -z en three.js
  const dir = new THREE.Vector3(wx, 0, -wy).normalize();
  windGroup.userData.dir = dir;
  windGroup.userData.strength = E.wind || 0;
  const sock = windGroup.userData.sock;
  // La manga apunta a sotavento y se levanta con la fuerza
  const yaw = Math.atan2(-dir.z, dir.x);
  sock.rotation.set(0, yaw, -(Math.PI / 2) * (0.25 + 0.75 * Math.min(1, (E.wind || 0) / 0.3)));
  sock.rotation.order = "YZX";
  const pct = Math.round((E.wind || 0) / 0.3 * 100);
  document.getElementById("wind").textContent = `viento ${pct}% · ráfagas ${E.pushes ? E.pushes.length : 0}`;
}

// ---------- Edificios (columnas) ----------
const LOW = new THREE.Color(0xe2e8f0), HIGH = new THREE.Color(0x64748b);
const roofMat = new THREE.MeshStandardMaterial({ map: roofTex, roughness: .9 });
let buildingMats = [], xray = false;
function building(x0, x1, y0, y1, h, group) {
  const w = (x1 - x0 + 1) * cell, d = (y1 - y0 + 1) * cell;
  const geo = new THREE.BoxGeometry(w, h, d);
  // Ajusta las UV de cada cara para que la fachada se repita cada 5 m (ventanas a escala real)
  const uv = geo.attributes.uv;
  const faceSize = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];  // +x, -x, +y, -y, +z, -z
  for (let f = 0; f < 6; f++)
    for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      uv.setXY(i, uv.getX(i) * faceSize[f][0] / cell, uv.getY(i) * faceSize[f][1] / cell);
    }
  const tint = LOW.clone().lerp(HIGH, (h - 15) / 40);
  const side = new THREE.MeshStandardMaterial({ map: facadeTex, color: tint, emissiveMap: facadeGlow,
    emissive: 0xffd28a, emissiveIntensity: 0.12, roughness: .55, metalness: .15, transparent: true, opacity: xray ? .25 : 1 });
  buildingMats.push(side);
  const m = new THREE.Mesh(geo, [side, side, roofMat, roofMat, side, side]);
  m.position.set(x0 * cell + w / 2, h / 2, -(y0 * cell + d / 2));
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  // Pretil y antena en la azotea
  const parapet = new THREE.Mesh(new THREE.BoxGeometry(w + .4, .8, d + .4), new THREE.MeshStandardMaterial({ color: 0x475569 }));
  parapet.position.set(m.position.x, h + .4, m.position.z);
  parapet.castShadow = true;
  group.add(parapet);
  if (h >= 40) {
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 5, 6), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
    mast.position.set(m.position.x, h + 3, m.position.z);
    group.add(mast);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff3b3b }));
    tip.position.set(m.position.x, h + 5.6, m.position.z);
    tip.userData.blink = true;
    group.add(tip);
  }
}
function setXray(on) {
  xray = on;
  for (const m of buildingMats) { m.opacity = on ? .25 : 1; m.depthWrite = !on; }
  document.getElementById("xray").classList.toggle("on", on);
}

// ---------- Dron ----------
function makeDrone() {
  const d = new THREE.Group();          // posición + orientación (yaw/inclinación)
  const dark = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: .6, roughness: .35 });
  const shell = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: .2, roughness: .3 });
  const accent = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: .3, roughness: .4 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 1.2, 6, 16), shell);
  body.rotation.x = Math.PI / 2;        // eje largo hacia delante (-Z)
  body.castShadow = true;
  d.add(body);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.15, .12, 1.4), accent);
  stripe.position.y = .32;
  d.add(stripe);
  const cam = new THREE.Mesh(new THREE.SphereGeometry(.28, 16, 12), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: .9, roughness: .1 }));
  cam.position.set(0, -.25, -1.05);
  d.add(cam);
  const props = [];
  for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const len = 2.1;
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, len, 8), dark);
    arm.rotation.z = Math.PI / 2;
    arm.rotation.y = Math.atan2(sz, -sx);
    arm.position.set(sx * len / 2 * .72, .1, sz * len / 2 * .72);
    arm.castShadow = true;
    d.add(arm);
    const mx = sx * 1.55, mz = sz * 1.55;
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .35, 14), dark);
    motor.position.set(mx, .25, mz);
    d.add(motor);
    const prop = new THREE.Group();
    prop.position.set(mx, .47, mz);
    for (let k = 0; k < 2; k++) {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(1.7, .03, .16), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      blade.rotation.y = k * Math.PI / 2;
      prop.add(blade);
    }
    const blur = new THREE.Mesh(new THREE.CircleGeometry(.9, 32),
      new THREE.MeshBasicMaterial({ color: 0xcbd5e1, transparent: true, opacity: .12, depthWrite: false, side: THREE.DoubleSide }));
    blur.rotation.x = -Math.PI / 2;
    prop.add(blur);
    d.add(prop);
    props.push(prop);
    // Patas de aterrizaje
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .8, 6), dark);
    leg.position.set(sx * .55, -.55, sz * .55);
    d.add(leg);
  }
  // Luces de navegación: roja a babor (izquierda), verde a estribor, estroboscópica blanca
  const navL = new THREE.Mesh(new THREE.SphereGeometry(.13, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2d2d }));
  navL.position.set(-1.55, .25, -1.55);
  const navR = new THREE.Mesh(new THREE.SphereGeometry(.13, 10, 8), new THREE.MeshBasicMaterial({ color: 0x22ff6a }));
  navR.position.set(1.55, .25, -1.55);
  const strobe = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  strobe.position.set(0, .45, .7);
  d.add(navL, navR, strobe);
  // Caja de suministros colgando
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 1.4, 4), new THREE.MeshBasicMaterial({ color: 0x111827 }));
  rope.position.y = -1.2;
  const crate = new THREE.Mesh(new THREE.BoxGeometry(1, .8, 1), new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: .8 }));
  crate.position.y = -2.2;
  crate.castShadow = true;
  const cross = new THREE.Mesh(new THREE.BoxGeometry(1.02, .2, .3), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  cross.position.y = -2.2;
  const cross2 = cross.clone(); cross2.rotation.y = Math.PI / 2;
  d.add(rope, crate, cross, cross2);
  d.userData = { props, strobe };
  return d;
}
const drone = makeDrone();
drone.scale.setScalar(1.5);  // algo más grande que a escala real para verlo bien
scene.add(drone);
// Luz que acompaña al dron (ilumina edificios cercanos)
const droneLight = new THREE.PointLight(0xfff7e0, 25, 25, 2);
droneLight.position.y = -3;  // debajo del dron: ilumina el entorno sin quemar el cuerpo
drone.add(droneLight);

// ---------- Postes, cables y aves (grid-drone-v3) ----------
const CITY = episodes.some((e) => e.birds);
const birdMeshes = [];
const birdMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, emissive: 0xf472b6, emissiveIntensity: .6, roughness: .5 });
function makeBird() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.6, 6), birdMat);
  body.rotation.x = Math.PI / 2;
  g.add(body);
  for (const sx of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(2.2, .06, .7), birdMat);
    wing.position.set(sx * 1.1, 0, .1);
    wing.userData.sx = sx;
    g.add(wing);
  }
  const halo = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 8),
    new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: .07, depthWrite: false }));
  g.add(halo);
  g.scale.setScalar(2.2);  // más grandes que a escala real para verlas desde lejos
  g.visible = false;
  scene.add(g);
  return g;
}
if (CITY) for (let k = 0; k < 6; k++) birdMeshes.push(makeBird());
function addPolesAndCables(E, group) {
  if (!E.poles) return;
  const h = (E.pole_height || 2) * cell;
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xb45309, emissiveIntensity: .25 });
  for (const [x, y] of E.poles) {
    const w = toWorld([x, y, 0]);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.18, .25, h, 8), poleMat);
    pole.position.set(w.x, h / 2, w.z);
    pole.castShadow = true;
    group.add(pole);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(2.2, .18, .18), poleMat);
    arm.position.set(w.x, h - .3, w.z);
    group.add(arm);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xfff3c4 }));
    lamp.position.set(w.x, h - .6, w.z);
    group.add(lamp);
  }
  // Cables: un tubo por cada tramo contiguo (celdas de cable + postes a ambos lados), a la altura del cable
  const cableSet = new Set(E.cables.map(([x, y]) => `${x},${y}`));
  const poleSet = new Set(E.poles.map(([x, y]) => `${x},${y}`));
  const cableMat = new THREE.MeshBasicMaterial({ color: 0x1f2937 });
  const seen = new Set();
  for (const [x, y] of E.poles) {
    for (const [dx, dy] of [[1, 0], [0, 1]]) {
      let cx = x + dx, cy = y + dy;
      if (!cableSet.has(`${cx},${cy}`)) continue;
      const key = `${x},${y}:${dx},${dy}`;
      if (seen.has(key)) continue;
      seen.add(key);
      while (cableSet.has(`${cx},${cy}`)) { cx += dx; cy += dy; }
      if (!poleSet.has(`${cx},${cy}`)) continue;
      const a = toWorld([x, y, 0]), b = toWorld([cx, cy, 0]);
      const mid = a.clone().add(b).multiplyScalar(.5);
      mid.y = h - .35;
      const sag = new THREE.QuadraticBezierCurve3(new THREE.Vector3(a.x, h - .3, a.z), new THREE.Vector3(mid.x, h - 1.4, mid.z), new THREE.Vector3(b.x, h - .3, b.z));
      group.add(new THREE.Mesh(new THREE.TubeGeometry(sag, 12, .07, 5, false), cableMat));
    }
  }
}
function showBirds(E, i, f) {
  if (!E.birds) { birdMeshes.forEach((b) => (b.visible = false)); return; }
  const now = E.birds[Math.min(i, E.birds.length - 1)], next = E.birds[Math.min(i + 1, E.birds.length - 1)];
  birdMeshes.forEach((mesh, k) => {
    const b = now[k];
    if (!b) { mesh.visible = false; return; }
    const n = next[k] || b;
    const p = toWorld(b).lerp(toWorld(n), f);
    mesh.visible = true;
    mesh.position.copy(p);
    const dir = toWorld(n).sub(toWorld(b));
    if (dir.lengthSq() > .01) mesh.rotation.y = Math.atan2(dir.x, dir.z);
    mesh.children.forEach((c) => { if (c.userData.sx) c.rotation.z = c.userData.sx * Math.sin(performance.now() / 90 + k) * .5; });
  });
}

// ---------- Mapa actual: edificios + ruta ----------
let mapGroup = null, path, result, pts, curve, trail, ep = 0, segs = 1, t = 0;
const RADIAL = 8, PER_SEG = 6;
function loadEpisode(i) {
  ep = (i + episodes.length) % episodes.length;
  if (mapGroup) {
    mapGroup.traverse((o) => {
      o.geometry?.dispose();
      for (const m of [].concat(o.material || [])) if (m !== roofMat) m.dispose();
    });
    scene.remove(mapGroup);
  }
  mapGroup = new THREE.Group();
  buildingMats = [];
  const E = episodes[ep];
  ({ path, result } = E);
  if (E.start) { start = E.start; movePad("A", start); }
  if (E.goal) { goal = E.goal; movePad("B", goal); }
  setWind(E);
  document.getElementById("battery").style.display = E.battery ? "block" : "none";
  document.getElementById("wind").style.display = E.battery ? "block" : "none";
  for (const c of E.columns) building(...c, mapGroup);
  addPolesAndCables(E, mapGroup);
  document.getElementById("citylegend").style.display = E.poles ? "inline" : "none";

  pts = path.map(toWorld);
  pts[0].y = 1.6; pts[pts.length - 1].y = 1.6;  // A y B a ras de helipuerto
  // Ruta como tubo: la completa tenue y el tramo recorrido brillante
  curve = new THREE.CurvePath();
  for (let k = 0; k < pts.length - 1; k++) curve.add(new THREE.LineCurve3(pts[k], pts[k + 1]));
  segs = Math.max(1, pts.length - 1);
  const ghost = new THREE.Mesh(new THREE.TubeGeometry(curve, segs * PER_SEG, .18, RADIAL, false),
    new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: .28, depthWrite: false }));
  trail = new THREE.Mesh(new THREE.TubeGeometry(curve, segs * PER_SEG, .32, RADIAL, false),
    new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x38bdf8, emissiveIntensity: 2.2 }));
  trail.geometry.setDrawRange(0, 0);
  mapGroup.add(ghost, trail);
  scene.add(mapGroup);

  const climbs = path.slice(1).filter((p, k) => p[2] !== path[k][2] && !isPad(p)).length;
  const verdict = result === "goal" ? "ENTREGADO" : result === "battery" ? "SIN BATERÍA"
    : result === "crash" && E.cause === "viento" ? "CHOQUE POR EL VIENTO"
    : result === "crash" && E.cause === "ave" ? "CHOQUE CON UN AVE" : result.toUpperCase();
  document.getElementById("title").textContent = `${env} · ${verdict} · ${path.length - 1} pasos`;
  document.getElementById("mapinfo").textContent =
    `mapa ${ep + 1}/${episodes.length}` + (E.seed != null ? ` · semilla ${E.seed}` : "") +
    ` · ${E.columns.length} edificios` + (E.poles ? ` · ${E.poles.length} postes · ${E.birds[0].length} aves` : "") +
    (E.astar ? ` · A*: ${E.astar} pasos` : "") + ` · ${climbs} cambios de altura en vuelo`;
  timeline.max = segs;
  t = 0;
}

// ---------- Controles de la interfaz ----------
const $ = (id) => document.getElementById(id);
const timeline = $("timeline"), speedEl = $("speed"), playBtn = $("play"), camBtn = $("cam");
let playing = true, scrubbing = false;
const CAMS = ["Libre", "Seguir", "Piloto"];
let camMode = 0, snapCam = false;
function setPlaying(p) { playing = p; playBtn.textContent = p ? "⏸ pausa" : "⏵ play"; }
function setCam(k) {
  camMode = k % CAMS.length;
  camBtn.textContent = "🎥 " + CAMS[camMode];
  controls.enabled = camMode === 0;
  snapCam = true;  // colocarse ya detrás del dron, luego seguirlo suavemente
  if (camMode === 0) { controls.target.copy(drone.position); controls.update(); }
}
playBtn.onclick = () => setPlaying(!playing);
$("prev").onclick = () => loadEpisode(ep - 1);
$("next").onclick = () => loadEpisode(ep + 1);
camBtn.onclick = () => setCam(camMode + 1);
$("xray").onclick = () => setXray(!xray);
timeline.addEventListener("input", () => { scrubbing = true; t = +timeline.value; });
timeline.addEventListener("change", () => { scrubbing = false; });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") loadEpisode(ep + 1);
  else if (e.key === "ArrowLeft") loadEpisode(ep - 1);
  else if (e.key === " ") { setPlaying(!playing); e.preventDefault(); }
  else if (e.key.toLowerCase() === "c") setCam(camMode + 1);
  else if (e.key.toLowerCase() === "x") setXray(!xray);
});
// Parámetros opcionales en la URL, p. ej. drone_view.html#map=2&cam=1&xray=1&t=20&pause=1
const params = new URLSearchParams(location.hash.slice(1));
loadEpisode(+(params.get("map") || 1) - 1);
if (params.has("cam")) setCam(+params.get("cam"));
if (params.get("xray") === "1") setXray(true);
if (params.has("t")) t = +params.get("t");
if (params.get("pause") === "1") setPlaying(false);

function phase(i) {
  const E = episodes[ep];
  if (i >= path.length - 1) return result === "goal" ? "✅ suministros entregados" : result === "battery" ? "🪫 batería agotada"
    : result === "crash" ? (E.cause === "viento" ? "💨💥 el viento lo estrelló" : E.cause === "ave" ? "🐦💥 chocó con un ave" : "💥 choque") : "⌛ sin tiempo";
  if (E.pushes && E.pushes.includes(i + 1)) return "💨 ráfaga: lo empuja el viento";
  const [x, y, z] = path[i], dz = path[i + 1][2] - z;
  if (x === start[0] && y === start[1]) return "⬆ despegue vertical";
  if (x === goal[0] && y === goal[1]) return "⬇ aterrizaje vertical";
  if (dz > 0) return "⬆ sube para sobrevolar";
  if (dz < 0) return "⬇ baja";
  return "➜ navegación";
}

// ---------- Bucle de animación ----------
const clock = new THREE.Clock();
const heading = new THREE.Vector3(1, 0, -1).normalize();
let yaw = Math.atan2(-heading.x, -heading.z), pitch = 0, roll = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (playing && !scrubbing) {
    t += dt * speedEl.value;
    if (t > segs + 2) t = 0;  // pausa breve al final y vuelve a empezar
  }
  const tc = Math.min(t, segs);
  const i = Math.min(Math.floor(tc), segs - 1), f = tc - i;
  const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
  // Suavizado de la posición entre celdas (arranca y frena en cada tramo)
  const s = f * f * (3 - 2 * f);
  const pos = a.clone().lerp(b, s);
  drone.position.copy(pos).add(new THREE.Vector3(0, 1.2, 0));

  // Orientación: gira hacia donde va y se inclina al acelerar (como un dron real)
  const dir = b.clone().sub(a);
  const horiz = new THREE.Vector3(dir.x, 0, dir.z);
  const moving = tc < segs;
  if (horiz.lengthSq() > 0.01 && moving) heading.copy(horiz.normalize());
  const targetYaw = Math.atan2(-heading.x, -heading.z);
  let dy = targetYaw - yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  yaw += dy * Math.min(1, dt * 6);
  const effort = moving && horiz.lengthSq() > 0.01 ? Math.sin(Math.PI * f) : 0;
  pitch += (-0.28 * effort - pitch) * Math.min(1, dt * 8);
  roll += (-dy * 0.6 - roll) * Math.min(1, dt * 6);
  drone.rotation.set(pitch, yaw, roll, "YXZ");
  for (const p of drone.userData.props) p.rotation.y += dt * (moving ? 60 : 25);
  drone.userData.strobe.visible = (time % 1.2) < 0.08;

  // Estela: tramo recorrido del tubo
  trail.geometry.setDrawRange(0, Math.floor(tc * PER_SEG) * RADIAL * 6);
  if (!scrubbing) timeline.value = tc;

  // Luces parpadeantes (helipuertos y antenas)
  pads.forEach((pd, k) => {
    const on = 0.35 + 0.65 * Math.max(0, Math.sin(time * 4 + k * Math.PI));
    pd.lights.forEach((l, j) => l.material.color.copy(pd.color).multiplyScalar(on * (j % 2 ? 1 : 0.7) * 2));
  });
  const blinkOn = (time % 1.6) < 0.8;
  mapGroup.traverse((o) => { if (o.userData.blink) o.visible = blinkOn; });

  // Cámaras
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  if (camMode === 1) {        // sigue al dron desde atrás y arriba
    // Casi en vertical sobre el dron: los edificios salen del suelo, así que encima del dron nunca hay
    // nada que lo tape. Un poco por detrás para ver hacia dónde va.
    camPos.copy(drone.position).addScaledVector(fwd, -8);
    camPos.y = H + 20;
    camera.position.lerp(camPos, snapCam ? 1 : Math.min(1, dt * 3));
    camLook.lerp(drone.position, snapCam ? 1 : Math.min(1, dt * 8));
    snapCam = false;
    camera.lookAt(camLook);
  } else if (camMode === 2) { // primera persona desde la cámara del dron
    camera.position.copy(drone.position).addScaledVector(fwd, 2.2).add(new THREE.Vector3(0, -0.2, 0));
    camera.lookAt(camera.position.clone().addScaledVector(fwd, 20).add(new THREE.Vector3(0, -2, 0)));
  } else {
    camLook.copy(drone.position);
    controls.update();
  }

  // Viento: flechas que cruzan el espacio de vuelo a sotavento, más rápidas con más fuerza
  if (STORM && windGroup.userData.dir) {
    const dir = windGroup.userData.dir, strength = windGroup.userData.strength;
    const speed = 0.04 + 0.5 * strength;
    const side = new THREE.Vector3(-dir.z, 0, dir.x);
    for (const a of windArrows) {
      a.userData.phase = (a.userData.phase + dt * speed) % 1;
      const along = (a.userData.phase - 0.5) * 1.6 * Math.max(W, D);
      a.position.copy(CENTER).addScaledVector(dir, along).addScaledVector(side, (a.userData.lane[0] - 0.5) * 1.2 * Math.max(W, D));
      a.position.y = 8 + a.userData.lane[1] * (H - 8);
      a.rotation.y = Math.atan2(-dir.z, dir.x);
      a.visible = strength > 0.02;
    }
  }
  showBirds(episodes[ep], i, s);
  // Panel
  const E = episodes[ep];
  const zNow = path[i][2] + (path[Math.min(i + 1, path.length - 1)][2] - path[i][2]) * s;
  $("alt").textContent = `${Math.round(zNow * cell)} m`;
  $("phase").textContent = phase(i + (tc >= segs ? 1 : 0));
  $("stepinfo").textContent = `paso ${Math.min(Math.round(tc), segs)}/${segs}`;
  if (E.battery) {
    const bNow = E.battery[i] + (E.battery[Math.min(i + 1, E.battery.length - 1)] - E.battery[i]) * s;
    const frac = Math.max(0, bNow / E.capacity);
    $("batt-pct").textContent = `${Math.round(frac * 100)}%`;
    const fill = $("batt-fill");
    fill.style.width = `${frac * 100}%`;
    fill.className = "fill" + (frac < 0.15 ? " critical" : frac < 0.35 ? " low" : "");
    const gusting = E.pushes && E.pushes.includes(i + 1) && f > 0.35 && tc < segs;
    $("gust").style.display = gusting ? "block" : "none";
  }

  composer.render();
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
