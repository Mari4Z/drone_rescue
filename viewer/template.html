<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Rescue 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; color: #e6edf3; font: 14px system-ui, sans-serif; overflow: hidden; }
  #hud { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 32, .85); padding: 10px 14px; border-radius: 8px; line-height: 1.6; }
  #hud b { color: #7dd3fc; }
  button { background: #1e293b; color: #e6edf3; border: 1px solid #334155; border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-right: 4px; }
  button:hover { background: #334155; }
  .a { color: #4ade80; } .b { color: #f87171; }
  #error { display: none; position: absolute; inset: 0; margin: auto; width: min(560px, 90vw); height: fit-content; background: #3f1d1d; border: 1px solid #f87171; border-radius: 8px; padding: 16px 20px; line-height: 1.5; }
  #error code { background: #0f1720; padding: 2px 6px; border-radius: 4px; }
</style>
<script>
  // Si algo falla (sin datos, sin internet para cargar three.js, sin WebGL) se muestra en vez de una pantalla negra
  function showError(html) {
    const el = document.getElementById("error");
    el.innerHTML = html;
    el.style.display = "block";
  }
  addEventListener("error", (e) => {
    if (document.getElementById("error").style.display === "block") return;
    const src = e.target && e.target.src;
    showError(src
      ? `No se pudo cargar <code>${src}</code>. ¿Hay conexión a internet?`
      : `Error: ${e.message}`);
  }, true);
  setTimeout(() => {
    if (!window.__droneReady && document.getElementById("error").style.display !== "block")
      showError("three.js no terminó de cargar. Revisa la conexión a internet o abre el archivo en Chrome, Firefox o Safari reciente.");
  }, 8000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div><b id="title"></b></div>
  <div><span class="a">● A</span> inicio &nbsp; <span class="b">● B</span> meta</div>
  <div id="mapinfo"></div>
  <div id="status"></div>
  <div style="margin-top:6px">
    <button id="prev">◀ Mapa</button><button id="next">Mapa ▶</button>
    <button id="play">⏸ Pausa</button><button id="restart">↺ Reiniciar</button>
    <label>velocidad <input id="speed" type="range" min="1" max="20" value="6"></label>
  </div>
  <div style="margin-top:4px; opacity:.7">columnas: <span style="color:#a7f3d0">baja</span> → <span style="color:#64748b">alta</span> · ←/→ cambia de mapa</div>
</div>
<div id="error"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const DATA = /*DATA*/null;
window.__droneReady = true;
if (!DATA) {
  showError(`Esta es la <b>plantilla</b>, no tiene datos. Genera la vista con:<br><br>
    <code>.venv/bin/python cli.py run --model models/dummy.npy --web</code><br><br>
    y abre <code>drone_view.html</code> (en la raíz del proyecto).`);
  throw new Error("sin datos");
}
if (!document.createElement("canvas").getContext("webgl2")) {
  showError("Este navegador no tiene WebGL activado; three.js lo necesita.");
  throw new Error("sin WebGL");
}
const { cell, size, start, goal, env } = DATA;
// Formato antiguo (un solo intento) o nuevo (lista de mapas)
const episodes = DATA.episodes || [{ columns: DATA.columns, path: DATA.path, result: DATA.result }];
const [NX, NY, NZ] = size;
const W = NX * cell, D = NY * cell, H = NZ * cell;

// Coordenadas: x del entorno -> x, y del entorno -> -z, altura -> y (y arriba en three.js)
const toWorld = ([x, y, z]) => new THREE.Vector3((x + .5) * cell, (z + .5) * cell, -(y + .5) * cell);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1720);
scene.fog = new THREE.Fog(0x0f1720, 250, 500);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 2000);
camera.position.set(W + 50, 105, 45);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(W / 2, 15, -D / 2);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x223322, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-40, 120, 40);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 400 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// Suelo, rejilla y límites del espacio de vuelo
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ color: 0x1d3b2a }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(W / 2, 0, -D / 2);
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(W, NX, 0x3b6b4f, 0x2a4a38);
grid.position.set(W / 2, 0.05, -D / 2);
scene.add(grid);
const bounds = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)),
  new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: .5 }));
bounds.position.set(W / 2, H / 2, -D / 2);
scene.add(bounds);

// Columnas (obstáculos), coloreadas por altura: claras = bajas, oscuras = altas
const LOW = new THREE.Color(0xa7f3d0), HIGH = new THREE.Color(0x64748b);
function buildColumns(columns, group) {
  for (const [x0, x1, y0, y1, h] of columns) {
    const w = (x1 - x0 + 1) * cell, d = (y1 - y0 + 1) * cell;
    // Algo transparentes para ver el dron en los mapas densos
    const mat = new THREE.MeshStandardMaterial({ color: LOW.clone().lerp(HIGH, (h - 15) / 40), roughness: .8,
      transparent: true, opacity: .75, depthWrite: false });
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x0 * cell + w / 2, h / 2, -(y0 * cell + d / 2));
    m.castShadow = m.receiveShadow = true;
    group.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x334155 }));
    e.position.copy(m.position);
    group.add(e);
  }
}

// Plataformas A y B con relieve y etiqueta
function pad(p, color, label) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(cell * .55, cell * .6, 1, 32),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .4 }));
  base.position.y = .5;
  g.add(base);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, H, 8),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .25 }));
  beam.position.y = H / 2;
  g.add(beam);
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#" + color.toString(16).padStart(6, "0");
  ctx.font = "bold 100px system-ui";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, 64, 70);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
  s.scale.set(8, 8, 1);
  s.position.y = 12;
  g.add(s);
  const w = toWorld(p);
  g.position.set(w.x, 0, w.z);
  scene.add(g);
}
pad(start, 0x4ade80, "A");
pad(goal, 0xf87171, "B");

// Mapa actual: columnas + ruta (se reconstruye al cambiar de mapa)
let mapGroup = null, path, result, pts, trailGeo, ep = 0;
function loadEpisode(i) {
  ep = (i + episodes.length) % episodes.length;
  if (mapGroup) {
    mapGroup.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
    scene.remove(mapGroup);
  }
  mapGroup = new THREE.Group();
  const E = episodes[ep];
  ({ path, result } = E);
  buildColumns(E.columns, mapGroup);

  pts = path.map(toWorld);
  pts[0].y = 1; pts[pts.length - 1].y = 1;  // A y B a ras de plataforma
  const fullLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({ color: 0x7dd3fc, dashSize: 1.5, gapSize: 1.5, transparent: true, opacity: .35 }));
  fullLine.computeLineDistances();
  mapGroup.add(fullLine);
  trailGeo = new THREE.BufferGeometry().setFromPoints(pts);
  trailGeo.setDrawRange(0, 1);
  mapGroup.add(new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8 })));
  scene.add(mapGroup);

  const climbs = path.slice(1).filter((p, k) => p[2] !== path[k][2]
    && !(p[0] === start[0] && p[1] === start[1]) && !(p[0] === goal[0] && p[1] === goal[1])).length;
  document.getElementById("title").textContent = `${env} · ${result.toUpperCase()} · ${path.length - 1} pasos`;
  document.getElementById("mapinfo").textContent =
    `mapa ${ep + 1}/${episodes.length}` + (E.seed != null ? ` · semilla ${E.seed}` : "") +
    ` · ${E.columns.length} columnas` + (E.astar ? ` · A*: ${E.astar} pasos` : "") +
    ` · ${climbs} cambios de altura en vuelo`;
  t = 0;
}

// Dron: cuerpo + 4 brazos con rotores
const drone = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, .8, 2.4), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
body.castShadow = true;
drone.add(body);
const rotors = [];
for (const [dx, dz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.3, .3, 2.6), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
  arm.position.set(dx * .9, 0, dz * .9);
  arm.rotation.y = Math.atan2(dx, dz);
  drone.add(arm);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .1, 16),
    new THREE.MeshStandardMaterial({ color: 0xe2e8f0, transparent: true, opacity: .6 }));
  r.position.set(dx * 1.8, .5, dz * 1.8);
  drone.add(r);
  rotors.push(r);
}
const crate = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xb45309 }));
crate.position.y = -1;
drone.add(crate);
scene.add(drone);

// Animación
const statusEl = document.getElementById("status");
const speedEl = document.getElementById("speed");
let t = 0, playing = true;
loadEpisode(0);
const playBtn = document.getElementById("play");
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "⏸ Pausa" : "▶ Seguir"; };
document.getElementById("restart").onclick = () => { t = 0; };
document.getElementById("prev").onclick = () => loadEpisode(ep - 1);
document.getElementById("next").onclick = () => loadEpisode(ep + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") loadEpisode(ep + 1);
  if (e.key === "ArrowLeft") loadEpisode(ep - 1);
});

const clock = new THREE.Clock();
function phase(i) {
  if (i >= path.length - 1) return result === "goal" ? "entregado ✅" : result;
  const [x, y, z] = path[i], dz = path[i + 1][2] - z;
  if (x === start[0] && y === start[1]) return "despegue ↑";
  if (x === goal[0] && y === goal[1]) return "descenso ↓";
  if (dz > 0) return "sube para sobrevolar ↑";
  if (dz < 0) return "baja ↓";
  return "navegación →";
}
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (playing) t = Math.min(t + dt * speedEl.value, pts.length - 1);
  const i = Math.floor(t), f = t - i;
  const p = pts[i].clone().lerp(pts[Math.min(i + 1, pts.length - 1)], f);
  drone.position.copy(p).add(new THREE.Vector3(0, 1.5, 0));
  for (const r of rotors) r.rotation.y += dt * 40;
  trailGeo.setDrawRange(0, i + 2);
  const [, , z] = path[i];
  statusEl.textContent = `paso ${i}/${path.length - 1} · altura ${z * cell} m · ${phase(i)}`;
  if (t >= pts.length - 1 && playing) setTimeout(() => { if (t >= pts.length - 1) t = 0; }, 1500);
  controls.update();
  renderer.render(scene, camera);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
