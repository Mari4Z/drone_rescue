experiment:
  id: dqn-n1
  hypothesis: "Un DQN con entradas de escala fina aprende la misión base que Q-learning tabular no completó, en el mismo ambiente y con la misma recompensa."
level:
  id: N1
  config: configs/levels/n1_mision_base.yaml
training:
  steps: 1000000
  eval_every: 25000
  evaluation_seeds: [101, 211, 307, 401, 503]
  gamma: 0.995
  n_step: 5
  lr: 0.0003
  hidden: 256
  batch_size: 128
  buffer_size: 500000
  learning_starts: 5000
  train_freq: 2
  target_every: 2000
  actor_every: 500
  eps_end: 0.05
  eps_fraction: 0.4
  explore_hold: 8
  reward_scale: 0.1
