model_family: drone-rescue-v3
experiment:
  id: ppo-v3-n3
  hypothesis: "El viento horizontal degrada el éxito respecto a N2, porque la política debe corregir la deriva en cada episodio."
level:
  id: N3
  config: configs/levels/n3_operacion_exigente.yaml
training:
  timesteps: 8000000
  n_envs: 4
  evaluation_every: 250000
  evaluation_seeds: [101, 211, 307, 401, 503]
  agent:
    n_steps: 1024
    batch_size: 512
    n_epochs: 5
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    learning_rate: 0.0003
    net_arch: [128, 128]
