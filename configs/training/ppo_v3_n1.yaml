model_family: drone-rescue-v3
experiment:
  id: ppo-v3-n1
  hypothesis: "Con estabilizador y entrega por proximidad y estabilidad, PPO completa la misión base que no logran las políticas con control directo de fuerzas."
level:
  id: N1
  config: configs/levels/n1_mision_base.yaml
training:
  timesteps: 5000000
  n_envs: 4
  evaluation_every: 250000
  evaluation_seeds: [101, 211, 307, 401, 503]
  agent:
    n_steps: 1024
    batch_size: 512
    n_epochs: 5
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    learning_rate: 0.0003
    net_arch: [128, 128]
