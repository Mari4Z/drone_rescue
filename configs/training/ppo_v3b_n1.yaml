model_family: drone-rescue-v3
experiment:
  id: ppo-v3b-n1
  hypothesis: "Respecto a ppo-v3-n1, un horizonte más largo (gamma 0.995), lotes de 2048 pasos por ambiente y una red de 256x256 hacen que el aprendizaje se repita entre semillas. Base: Con estabilizador y entrega por proximidad y estabilidad, PPO completa la misión base que no logran las políticas con control directo de fuerzas."
level:
  id: N1
  config: configs/levels/n1_mision_base.yaml
training:
  timesteps: 8000000
  n_envs: 4
  evaluation_every: 250000
  evaluation_seeds: [101, 211, 307, 401, 503]
  agent:
    n_steps: 2048
    batch_size: 1024
    n_epochs: 5
    gamma: 0.995
    gae_lambda: 0.95
    ent_coef: 0.01
    learning_rate: 0.0003
    net_arch: [256, 256]
